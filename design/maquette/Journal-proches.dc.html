</div>
<div style="display: flex; gap: 12px; align-items: center">
<svg width="96" height="64" viewBox="0 0 96 64" aria-hidden="true" style="flex-shrink: 0; border-radius: 10px; background: #CFE3EA"><polyline points="{{r.pts}}" fill="none" stroke="#B83A0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 16px; font-weight: 600">{{r.name}}</span>
<span style="font-size: 13px; color: #4B575C">{{r.stats}}</span>

</div>

<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D3DADD; background: transparent; color: #0D1417; font-family: inherit; font-size: 14px; font-weight: 600">Commenter</button>
