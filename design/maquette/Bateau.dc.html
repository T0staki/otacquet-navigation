<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { show: true }; }
  renderVals() {
    return { show: this.state.show, toggle: () => this.setState({ show: !this.state.show }) };

}
